name: VaKoLink Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vakolink-windows.yml'
      - 'tools/Build-VaKoLinkWindows.ps1'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/vakolink-dotnet
        with:
          dotnet-version: 10.0.114

      - name: Verify Windows application routing in an isolated runner
        shell: pwsh
        env:
          QA_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $admin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          if (!$admin) { throw 'The Windows runner is not elevated.' }
          $qa = Join-Path $env:RUNNER_TEMP 'teredo-qa'
          $core = Join-Path $env:RUNNER_TEMP 'teredo-qa-release'
          $artifactDirectory = Join-Path $env:RUNNER_TEMP 'release-artifact'
          $outer = Join-Path $env:RUNNER_TEMP 'release-artifact.zip'
          $headers = @{ Authorization = "Bearer $env:QA_TOKEN"; Accept = 'application/vnd.github+json' }
          $list = Invoke-RestMethod -Headers $headers https://api.github.com/repos/Hell4ik/VaKoLink-Client/actions/runs/45237640795/artifacts
          $artifact = $list.artifacts | Where-Object name -eq 'VaKoLink-windows-x64' | Select-Object -First 1
          if (!$artifact) { throw 'Official CI artifact missing.' }
          Invoke-WebRequest -Headers $headers $artifact.archive_download_url -OutFile $outer
          if ("sha256:$((Get-FileHash -LiteralPath $outer).Hash)" -ne $artifact.digest) { throw 'Official CI artifact checksum differs.' }
          Expand-Archive -LiteralPath $outer -DestinationPath $artifactDirectory
          $archive = Get-ChildItem -LiteralPath $artifactDirectory -Filter '*.zip' | Select-Object -First 1
          if (!$archive) { throw 'Portable release ZIP missing.' }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $core
          $release = (Get-ChildItem -LiteralPath $core -Directory | Select-Object -First 1).FullName
          dotnet publish .github/teredo-qa/TeredoCheck.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true "-p:TransportSource=$env:GITHUB_WORKSPACE/Transport-1.0.4" -o $qa
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($folder in @('core','tools','fixture-xray')) {
            New-Item -ItemType Directory -Path (Join-Path $qa $folder) -Force | Out-Null
          }
          foreach ($asset in @('core/sing-box.exe','tools/ProxyNetworkState.ps1','tools/Discover-LocalProxy.ps1')) {
            Copy-Item -LiteralPath (Join-Path $release $asset) -Destination (Join-Path $qa $asset)
          }
          Copy-Item -LiteralPath (Join-Path $release 'bin/xray/xray.exe') -Destination (Join-Path $qa 'fixture-xray/xray.exe')
          $probe = Join-Path $qa 'VaKoLink-Teredo-Routed-Check.exe'
          $check = Start-Process -FilePath $probe -ArgumentList '--check' -WindowStyle Hidden -PassThru
          if (!$check.WaitForExit(45000)) { throw 'Policy and filter test timed out.' }
          Get-Content -LiteralPath (Join-Path $qa 'self-check.txt')
          if ($check.ExitCode) { exit $check.ExitCode }
          $network = Start-Process -FilePath $probe -ArgumentList '--local-route-check' -WindowStyle Hidden -PassThru
          if (!$network.WaitForExit(85000)) { throw 'Application routing test timed out.' }
          Get-Content -LiteralPath (Join-Path $qa 'local-route.json')
          exit $network.ExitCode

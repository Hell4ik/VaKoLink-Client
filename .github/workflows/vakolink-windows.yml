name: VaKoLink Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vakolink-windows.yml'
      - 'tools/Build-VaKoLinkWindows.ps1'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/vakolink-dotnet
        with:
          dotnet-version: 10.0.114

      - name: Build the portable Windows client
        shell: pwsh
        run: ./tools/Build-VaKoLinkWindows.ps1 -OutputDirectory "$env:RUNNER_TEMP/vakolink-output"

      - name: Upload the portable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: VaKoLink-windows-x64
          path: ${{ runner.temp }}/vakolink-output/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
